<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل أمر التشغيل - ملوك التنجيد</title>
    <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:Arial,Tahoma,sans-serif;
            background:#f5f5f5;
            color:#222;
        }
        header{
            background:#111827;
            color:#fff;
            padding:20px;
        }
        .container{
            max-width:1100px;
            margin:20px auto;
            padding:0 15px;
        }
        .card{
            background:#fff;
            border-radius:14px;
            padding:20px;
            margin-bottom:18px;
            box-shadow:0 3px 12px rgba(0,0,0,.08);
        }
        h1,h2{margin-top:0}
        .grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:15px;
        }
        .field{
            display:flex;
            flex-direction:column;
            gap:7px;
        }
        .full{grid-column:1/-1}
        input,select,textarea{
            width:100%;
            padding:11px;
            border:1px solid #d1d5db;
            border-radius:9px;
            font-size:15px;
        }
        button{
            border:0;
            border-radius:9px;
            padding:11px 18px;
            cursor:pointer;
            font-weight:700;
        }
        .primary{background:#2563eb;color:#fff}
        .danger{background:#dc2626;color:#fff}
        .secondary{background:#e5e7eb;color:#111827}
        .info{
            background:#f8fafc;
            border:1px solid #e5e7eb;
            border-radius:10px;
            padding:14px;
        }
        .service-row{
            display:grid;
            grid-template-columns:2fr 1fr 1fr 1fr auto;
            gap:10px;
            align-items:end;
            margin-bottom:12px;
        }
        .message{
            margin-top:12px;
            padding:10px;
            border-radius:8px;
            display:none;
        }
        @media(max-width:700px){
            .grid{grid-template-columns:1fr}
            .full{grid-column:auto}
            .service-row{grid-template-columns:1fr}
        }
    </style>
</head>

<body>

<header>
    <div class="container" style="margin:0 auto">
        <h1>👑 ملوك التنجيد</h1>
        <div>✏️ تعديل أمر التشغيل</div>
    </div>
</header>

<main class="container">

    <div id="loading" class="card">
        ⏳ جاري تحميل بيانات أمر التشغيل...
    </div>

    <section id="editForm" style="display:none">

        <div class="card">
            <h2>📋 بيانات أمر التشغيل</h2>

            <div id="orderInfo" class="info" style="margin-bottom:18px"></div>

            <div class="grid">

                <div class="field">
                    <label>👤 العميل</label>
                    <select id="customerId"></select>
                </div>

                <div class="field">
                    <label>🚗 السيارة</label>
                    <select id="vehicleId">
                        <option value="">بدون سيارة</option>
                    </select>
                </div>

                <div class="field">
                    <label>⚡ الأولوية</label>
                    <select id="priority">
                        <option value="LOW">منخفضة</option>
                        <option value="NORMAL">عادية</option>
                        <option value="HIGH">عالية</option>
                        <option value="URGENT">عاجلة</option>
                    </select>
                </div>

                <div class="field">
                    <label>📅 موعد التسليم</label>
                    <input id="promisedAt" type="datetime-local">
                </div>

                <div class="field full">
                    <label>📝 ملاحظات العميل</label>
                    <textarea id="customerNotes" rows="3"></textarea>
                </div>

                <div class="field full">
                    <label>📝 الملاحظات الداخلية</label>
                    <textarea id="internalNotes" rows="3"></textarea>
                </div>

            </div>
        </div>

        <div class="card">
            <h2>🛠️ خدمات أمر التشغيل</h2>
            <div id="servicesList"></div>
            <div id="servicesMessage" class="message"></div>
        </div>

        <div class="card">
            <h2>💰 الحسابات</h2>

            <div class="grid">

                <div class="field">
                    <label>الإجمالي قبل الخصم</label>
                    <input id="subtotal" type="number" min="0">
                </div>

                <div class="field">
                    <label>الخصم</label>
                    <input id="discountAmount" type="number" min="0">
                </div>

                <div class="field">
                    <label>الضريبة</label>
                    <input id="taxAmount" type="number" min="0">
                </div>

                <div class="field">
                    <label>الإجمالي النهائي</label>
                    <input id="totalAmount" type="number" min="0">
                </div>

                <div class="field">
                    <label>المدفوع مقدمًا</label>
                    <input id="depositAmount" type="number" min="0">
                </div>

                <div class="field">
                    <label>المتبقي</label>
                    <input id="balanceAmount" type="number" readonly>
                </div>

            </div>
        </div>

        <div class="card">
            <div id="saveMessage" class="message"></div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
                <button class="primary" type="button" onclick="saveChanges()">
                    💾 حفظ التعديلات
                </button>

                <button class="secondary" type="button"
                    onclick="history.back()">
                    ← إلغاء والعودة
                </button>
            </div>
        </div>

    </section>

</main>

<script>
const token =
    localStorage.getItem('token') ||
    localStorage.getItem('accessToken') ||
    '';

const params = new URLSearchParams(window.location.search);
const workOrderId = params.get('id');

let currentOrder = null;
let currentServices = [];
let customers = [];
let vehicles = [];

function api(path, options = {}) {
    return fetch(path, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            ...(options.headers || {})
        }
    });
}

function money(value) {
    return Number(value || 0).toLocaleString('ar-YE');
}

function showMessage(id, message, error = false) {
    const el = document.getElementById(id);
    if (!el) return;

    el.style.display = 'block';
    el.textContent = message;
    el.style.background = error ? '#fee2e2' : '#dcfce7';
    el.style.color = error ? '#991b1b' : '#166534';
}

async function loadData() {
    if (!workOrderId) {
        throw new Error('رقم أمر التشغيل غير موجود');
    }

    if (!token) {
        throw new Error('انتهت جلسة الدخول، يرجى تسجيل الدخول مرة أخرى');
    }

    const [orderResponse, servicesResponse, customersResponse, vehiclesResponse] =
        await Promise.all([
            api('/api/work-orders/' + encodeURIComponent(workOrderId)),
            api('/api/work-orders/' + encodeURIComponent(workOrderId) + '/services'),
            api('/api/customers'),
            api('/api/vehicles')
        ]);

    const orderData = await orderResponse.json();
    const servicesData = await servicesResponse.json();
    const customersData = await customersResponse.json();
    const vehiclesData = await vehiclesResponse.json();

    if (!orderResponse.ok || !orderData.success) {
        throw new Error(orderData.message || 'تعذر تحميل أمر التشغيل');
    }

    if (!servicesResponse.ok || !servicesData.success) {
        throw new Error(servicesData.message || 'تعذر تحميل خدمات أمر التشغيل');
    }

    if (!customersResponse.ok || !customersData.success) {
        throw new Error(customersData.message || 'تعذر تحميل العملاء');
    }

    if (!vehiclesResponse.ok || !vehiclesData.success) {
        throw new Error(vehiclesData.message || 'تعذر تحميل السيارات');
    }

    currentOrder = orderData.work_order;
    currentServices = servicesData.services || [];
    customers = customersData.customers || [];
    vehicles = vehiclesData.vehicles || [];

    if (currentOrder.status !== 'NEW') {
        throw new Error('يمكن تعديل أمر التشغيل فقط عندما تكون حالته NEW');
    }

    render();
}

function render() {
    document.getElementById('orderInfo').innerHTML =
        '<strong>رقم الأمر:</strong> ' +
        (currentOrder.work_order_no || '') +
        '<br><strong>الحالة:</strong> NEW';

    const customerSelect = document.getElementById('customerId');

    customerSelect.innerHTML = customers.map(c =>
        '<option value="' + c.customer_id + '">' +
        (c.full_name || '') +
        ' — ' +
        (c.customer_no || '') +
        '</option>'
    ).join('');

    customerSelect.value = String(currentOrder.customer_id || '');

    renderVehicles();

    document.getElementById('priority').value =
        currentOrder.priority || 'NORMAL';

    if (currentOrder.promised_at) {
        document.getElementById('promisedAt').value =
            new Date(currentOrder.promised_at).toISOString().slice(0,16);
    }

    document.getElementById('customerNotes').value =
        currentOrder.customer_notes || '';

    document.getElementById('internalNotes').value =
        currentOrder.internal_notes || '';

    document.getElementById('subtotal').value =
        Number(currentOrder.subtotal || 0);

    document.getElementById('discountAmount').value =
        Number(currentOrder.discount_amount || 0);

    document.getElementById('taxAmount').value =
        Number(currentOrder.tax_amount || 0);

    document.getElementById('totalAmount').value =
        Number(currentOrder.total_amount || 0);

    document.getElementById('depositAmount').value =
        Number(currentOrder.deposit_amount || 0);

    updateBalance();

    renderServices();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('editForm').style.display = 'block';
}

function renderVehicles() {
    const customerId =
        Number(document.getElementById('customerId').value || 0);

    const select = document.getElementById('vehicleId');

    const customerVehicles = vehicles.filter(v =>
        Number(v.customer_id) === customerId
    );

    select.innerHTML =
        '<option value="">بدون سيارة</option>' +
        customerVehicles.map(v =>
            '<option value="' + v.vehicle_id + '">' +
            (v.make || '') + ' ' +
            (v.model || '') + ' ' +
            (v.model_year || '') +
            (v.plate_no ? ' — ' + v.plate_no : '') +
            '</option>'
        ).join('');

    select.value = currentOrder.vehicle_id
        ? String(currentOrder.vehicle_id)
        : '';
}

document.getElementById('customerId').addEventListener('change', () => {
    currentOrder.vehicle_id = null;
    renderVehicles();
});

document.getElementById('totalAmount').addEventListener('input', updateBalance);
document.getElementById('depositAmount').addEventListener('input', updateBalance);

function updateBalance() {
    const total = Number(document.getElementById('totalAmount').value || 0);
    const deposit = Number(document.getElementById('depositAmount').value || 0);

    document.getElementById('balanceAmount').value =
        Math.max(total - deposit, 0);
}

function renderServices() {
    const container = document.getElementById('servicesList');

    if (!currentServices.length) {
        container.innerHTML =
            '<div class="info">لا توجد خدمات مسجلة في هذا الأمر.</div>';
        return;
    }

    container.innerHTML = currentServices.map((service, index) => `
        <div class="info service-row" data-service-id="${service.work_order_service_id}">
            <div class="field">
                <label>${index + 1}. ${service.service_name || 'خدمة'}</label>
                <textarea class="service-notes" rows="2">${service.notes || ''}</textarea>
            </div>

            <div class="field">
                <label>العدد</label>
                <input class="service-quantity" type="number" min="1" step="1"
                    value="${Number(service.quantity || 1)}">
            </div>

            <div class="field">
                <label>سعر الوحدة</label>
                <input class="service-price" type="number" min="0" step="1"
                    value="${Number(service.unit_price || 0)}">
            </div>

            <div class="field">
                <label>الخصم</label>
                <input class="service-discount" type="number" min="0" step="1"
                    value="${Number(service.discount || 0)}">
            </div>

            <button class="danger" type="button"
                onclick="deleteService(${service.work_order_service_id})">
                🗑️ حذف
            </button>
        </div>
    `).join('');
}

async function saveServices() {
    const rows = document.querySelectorAll('.service-row');

    for (const row of rows) {
        const id = row.dataset.serviceId;

        const quantity =
            Number(row.querySelector('.service-quantity').value || 1);

        const unit_price =
            Number(row.querySelector('.service-price').value || 0);

        const discount =
            Number(row.querySelector('.service-discount').value || 0);

        const notes =
            row.querySelector('.service-notes').value.trim();

        const response = await api(
            '/api/work-orders/' +
            encodeURIComponent(workOrderId) +
            '/services/' +
            encodeURIComponent(id),
            {
                method: 'PATCH',
                body: JSON.stringify({
                    quantity,
                    unit_price,
                    discount,
                    notes
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'تعذر تعديل إحدى الخدمات');
        }
    }
}

async function deleteService(id) {
    if (!confirm('هل أنت متأكد من حذف هذه الخدمة من أمر التشغيل؟')) {
        return;
    }

    try {
        const response = await api(
            '/api/work-orders/' +
            encodeURIComponent(workOrderId) +
            '/services/' +
            encodeURIComponent(id),
            {
                method: 'DELETE'
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'تعذر حذف الخدمة');
        }

        currentServices =
            currentServices.filter(
                service =>
                    Number(service.work_order_service_id) !== Number(id)
            );

        renderServices();

        showMessage('servicesMessage', '✅ تم حذف الخدمة بنجاح');

    } catch (error) {
        showMessage(
            'servicesMessage',
            error.message || 'تعذر حذف الخدمة',
            true
        );
    }
}

async function saveChanges() {
    try {
        const vehicleValue =
            document.getElementById('vehicleId').value;

        const payload = {
            customer_id:
                Number(document.getElementById('customerId').value),

            vehicle_id:
                vehicleValue ? Number(vehicleValue) : null,

            priority:
                document.getElementById('priority').value,

            promised_at:
                document.getElementById('promisedAt').value
                    ? new Date(
                        document.getElementById('promisedAt').value
                      ).toISOString()
                    : null,

            customer_notes:
                document.getElementById('customerNotes').value.trim(),

            internal_notes:
                document.getElementById('internalNotes').value.trim(),

            subtotal:
                Number(document.getElementById('subtotal').value || 0),

            discount_amount:
                Number(document.getElementById('discountAmount').value || 0),

            tax_amount:
                Number(document.getElementById('taxAmount').value || 0),

            total_amount:
                Number(document.getElementById('totalAmount').value || 0),

            deposit_amount:
                Number(document.getElementById('depositAmount').value || 0)
        };

        const response = await api(
            '/api/work-orders/' + encodeURIComponent(workOrderId),
            {
                method: 'PATCH',
                body: JSON.stringify(payload)
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'تعذر حفظ أمر التشغيل');
        }

        await saveServices();

        showMessage(
            'saveMessage',
            '✅ تم حفظ تعديلات أمر التشغيل بنجاح'
        );

        setTimeout(() => {
            window.location.href =
                '/work-order-details.html?id=' +
                encodeURIComponent(workOrderId);
        }, 800);

    } catch (error) {
        console.error(error);

        showMessage(
            'saveMessage',
            error.message || 'تعذر حفظ التعديلات',
            true
        );
    }
}

loadData().catch(error => {
    console.error(error);

    document.getElementById('loading').innerHTML =
        '<div style="color:#b91c1c;font-weight:bold;">❌ ' +
        (error.message || 'تعذر تحميل البيانات') +
        '</div>';
});
</script>

</body>
</html>

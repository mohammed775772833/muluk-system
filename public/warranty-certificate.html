<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شهادة ضمان - ملوك التنجيد</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eee;font-family:Tahoma,Arial,sans-serif}
.toolbar{text-align:center;padding:12px}
button{border:0;border-radius:8px;padding:11px 22px;margin:4px;font-size:15px;cursor:pointer}
.print-btn{background:#171717;color:#fff}
.back-btn{background:#ddd;color:#222}
.certificate{
  position:relative;width:1000px;height:667px;margin:auto;
  overflow:hidden;background:#fff;
}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0}
.data{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.value{
  position:absolute;
  text-align:center;
  font-size:14px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
  color:#171717;
  transform:translate(-50%,-100%);
}
.customer{left:30.9%;top:50.35%;width:31.2%}
.vehicle{left:30.9%;top:53.85%;width:31.2%}
.plate{left:30.9%;top:57.35%;width:31.2%}
.service{left:30.9%;top:60.85%;width:29.5%}
.workorder{left:72.6%;top:50.35%;width:25.2%}
.delivery{left:72.6%;top:53.85%;width:25.2%}
.branch{left:72.6%;top:57.35%;width:25.2%}
.technician{left:72.6%;top:60.85%;width:25.2%}
.message{text-align:center;padding:60px;font-size:18px}
@page{size:1000px 667px;margin:0}
@media print{
  html,body{width:1000px;height:667px;margin:0;padding:0;background:#fff}
  .toolbar{display:none!important}
  .certificate{width:1000px;height:667px;margin:0;page-break-after:avoid;break-after:avoid}
}
@media(max-width:800px){
  .certificate{width:100vw;height:66.7vw}
}

/* FINAL FIELD SCALE */
.certificate{
  container-type:inline-size;
}

.data .value{
  font-size:1.35cqw !important;
  font-weight:700 !important;
  line-height:1 !important;
  transform:translate(-50%,-100%) !important;
}

.data .customer{top:50.20% !important;}
.data .vehicle{top:53.70% !important;}
.data .plate{top:57.20% !important;}
.data .service{top:60.70% !important;}

.data .workorder{top:50.20% !important;}
.data .delivery{top:53.70% !important;}
.data .branch{top:57.20% !important;}
.data .technician{top:60.70% !important;}

</style>
</head>
<body>
<div class="toolbar">
  <button class="print-btn" onclick="window.print()">📄 حفظ PDF</button>
  <button class="back-btn" onclick="history.back()">← رجوع</button>
</div>
<div id="app"><div class="message">جاري تحميل الشهادة...</div></div>

<script>
const token=localStorage.getItem('token');
const params=new URLSearchParams(location.search);
const workOrderId=params.get('id');

function esc(v){
  return String(v ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replaceAll('>','&gt;').replaceAll('"','&quot;')
    .replaceAll(String.fromCharCode(39),'&#039;');
}
function fmtDate(v){
  if(!v)return '';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return String(v);
  return String(d.getDate()).padStart(2,'0')+'/'+
         String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

async function load(){
  if(!token){location.href='/';return}
  if(!workOrderId){
    document.getElementById('app').innerHTML='<div class="message">رقم أمر التشغيل غير موجود</div>';
    return;
  }

    const r=await fetch('/api/work-orders/'+encodeURIComponent(workOrderId)+'/warranty',
      {headers:{Authorization:'Bearer '+token}});

    if(r.status===401){location.href='/';return}
    if(!r.ok||!data.success){
      document.getElementById('app').innerHTML=
        '<div class="message">'+esc(data.message||'تعذر تحميل شهادة الضمان')+'</div>';

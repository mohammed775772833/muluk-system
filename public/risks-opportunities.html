<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المخاطر والفرص - ملوك التنجيد</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.back {
    color: white;
    text-decoration: none;
    font-size: 15px;
}

.container {
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 15px;
}

.primary {
    background: #111;
    color: white;
}

.secondary {
    background: white;
    border: 1px solid #ddd;
}

.form-box {
    display: none;
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #ddd;
}

.form-box h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.score {
    background: #f0f0f0;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    font-weight: bold;
}

.message {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 13px 10px;
    border-bottom: 1px solid #eee;
    text-align: right;
}

th {
    background: #f0f0f0;
}

.risk {
    font-weight: bold;
}

.actions button {
    margin: 2px;
}

@media (max-width: 700px) {
    .container {
        padding: 10px;
    }

    table {
        font-size: 13px;
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    th, td {
        padding: 9px 6px;
    }
}

/* ===== الهوية الموحدة - المخاطر والفرص ===== */

.unified-header {
    background: linear-gradient(135deg, #17365f, #285c9f);
    color: white;
    padding: 14px 18px;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.unified-header-inner {
    max-width: 1250px;
    min-height: 72px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
}

.unified-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.unified-logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
    background: white;
    padding: 3px;
    border-radius: 13px;
}

.unified-brand h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: white;
}

.unified-brand p {
    margin: 0;
    color: rgba(255,255,255,.82);
    font-size: 13px;
}

.unified-user {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-self: start;
}

.unified-user small {
    display: block;
    opacity: .75;
    margin-bottom: 3px;
}

.unified-user strong {
    font-size: 14px;
}

.unified-user-avatar {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: rgba(255,255,255,.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.unified-back {
    justify-self: end;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.12);
    color: white;
    border-radius: 12px;
    padding: 11px 16px;
    cursor: pointer;
    font: inherit;
    font-weight: bold;
}

@media (max-width:650px) {
    .unified-header {
        padding: 10px 12px;
    }

    .unified-header-inner {
        min-height: 62px;
        grid-template-columns: auto 1fr auto;
        gap: 8px;
    }

    .unified-user {
        display: none;
    }

    .unified-logo {
        width: 50px;
        height: 50px;
    }

    .unified-brand {
        justify-content: flex-start;
        gap: 7px;
    }

    .unified-brand h1 {
        font-size: 18px;
    }

    .unified-brand p {
        font-size: 11px;
    }

    .unified-back {
        padding: 8px 10px;
        font-size: 12px;
    }
}

</style>
</head>

<body>

<header class="unified-header">
    <div class="unified-header-inner">

        <div class="unified-user">
            <div class="unified-user-avatar">👤</div>
            <div>
                <small>مرحبًا</small>
                <strong>المخاطر والفرص</strong>
            </div>
        </div>

        <div class="unified-brand">
            <img src="/muluk-logo.jpg"
                 alt="ملوك التنجيد"
                 class="unified-logo">
            <div>
                <h1>ملوك التنجيد</h1>
                <p>إدارة المخاطر والفرص</p>
            </div>
        </div>

        <button type="button"
                class="unified-back"
                onclick="window.location.href='/dashboard.html'">
            ← الرئيسية
        </button>

    </div>
</header>

<div class="container">

    <div class="toolbar">
        <button class="primary" onclick="loadRisks()">
            🔄 تحديث
        </button>

        <button class="secondary" onclick="showForm()">
            ➕ إضافة خطر / فرصة
        </button>
    </div>

    <div id="formBox" class="form-box">

        <h2>➕ تسجيل خطر أو فرصة</h2>

        <label>النوع</label>
        <select id="type">
            <option value="RISK">خطر</option>
            <option value="OPPORTUNITY">فرصة</option>
        </select>

        <label>العنوان</label>
        <input id="title" placeholder="مثال: تأخر توفر خامات التنجيد">

        <label>الوصف / السبب</label>
        <textarea id="description" placeholder="اشرح الخطر أو الفرصة والسبب"></textarea>

        <label>الاحتمالية</label>
        <select id="probability" onchange="calculateScore()">
            <option value="1">1 - نادرة</option>
            <option value="2">2 - منخفضة</option>
            <option value="3" selected>3 - متوسطة</option>
            <option value="4">4 - عالية</option>
            <option value="5">5 - شبه مؤكدة</option>
        </select>

        <label>التأثير</label>
        <select id="impact" onchange="calculateScore()">
            <option value="1">1 - ضعيف</option>
            <option value="2">2 - محدود</option>
            <option value="3" selected>3 - متوسط</option>
            <option value="4">4 - كبير</option>
            <option value="5">5 - شديد</option>
        </select>

        <div class="score">
            مستوى الخطر الحالي:
            <span id="riskScore">9</span>
        </div>

        <label>الإجراء / المعالجة</label>
        <textarea id="mitigation_action" placeholder="الإجراء المتخذ لمعالجة الخطر أو استثمار الفرصة"></textarea>

        <label>المسؤول</label>
        <select id="responsible_employee_id">
            <option value="">اختر المسؤول</option>
            <option value="1">مدير النظام</option>
        </select>

        <label>تاريخ الاستحقاق</label>
        <input id="due_date" type="date">

        <label>الحالة</label>
        <select id="status">
            <option value="OPEN">مفتوح</option>
            <option value="IN_PROGRESS">قيد التنفيذ</option>
            <option value="CLOSED">مغلق</option>
        </select>

        <hr style="margin:25px 0;border:0;border-top:1px solid #eee;">

        <h3>📊 التقييم بعد تنفيذ الإجراء</h3>

        <label>الاحتمالية بعد الإجراء</label>
        <select id="post_probability" onchange="calculatePostScore()">
            <option value="">لم يتم التقييم</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <label>التأثير بعد الإجراء</label>
        <select id="post_impact" onchange="calculatePostScore()">
            <option value="">لم يتم التقييم</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <div class="score">
            مستوى الخطر المتبقي:
            <span id="postRiskScore">لم يتم التقييم</span>
        </div>

        <label>نتيجة فعالية الإجراء</label>
        <textarea id="effectiveness_result" placeholder="هل كان الإجراء فعالًا؟ وما النتيجة؟"></textarea>

        <label>تاريخ التقييم</label>
        <input id="assessment_date" type="date">

        <div style="margin-top:20px;">
            <button class="primary" onclick="saveRisk()">
                💾 حفظ
            </button>

            <button class="secondary" onclick="hideForm()">
                إلغاء
            </button>
        </div>

        <div id="formMessage" style="margin-top:15px;"></div>

    </div>

    <div id="content" class="message">
        جاري تحميل المخاطر والفرص...
    </div>

</div>

<script>

function getToken() {
    const token = localStorage.getItem('token');

    console.log('Muluk QMS Token Check:', {
        exists: !!token,
        length: token ? token.length : 0,
        startsWithJWT: token ? token.startsWith('eyJ') : false
    });

    return token;
}

function showForm() {
    document.getElementById('formBox').style.display = 'block';
    window.scrollTo(0, 0);
}

function hideForm() {
    document.getElementById('formBox').style.display = 'none';
}

function calculateScore() {
    const probability = Number(document.getElementById('probability').value);
    const impact = Number(document.getElementById('impact').value);

    document.getElementById('riskScore').textContent =
        probability * impact;
}

function calculatePostScore() {
    const probability =
        document.getElementById('post_probability').value;

    const impact =
        document.getElementById('post_impact').value;

    if (!probability || !impact) {
        document.getElementById('postRiskScore').textContent =
            'لم يتم التقييم';
        return;
    }

    document.getElementById('postRiskScore').textContent =
        Number(probability) * Number(impact);
}

async function loadRisks() {

    const token = getToken();

    if (!token) {
        document.getElementById('content').innerHTML =
            '❌ لا يوجد تسجيل دخول. يرجى تسجيل الدخول أولاً.';
        return;
    }

    try {

        const res = await fetch('/api/risks-opportunities', {
            headers: {
                'Authorization': 'Bearer ' + token
            }
        });

        if (!res.ok) {
            document.getElementById('content').innerHTML =
                '❌ تعذر تحميل المخاطر والفرص';
            return;
        }

        const data = await res.json();
        const rows = data.risks || [];

        if (rows.length === 0) {
            document.getElementById('content').innerHTML =
                'لا توجد مخاطر أو فرص مسجلة حتى الآن.';
            return;
        }

        let html = `
        <table>
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>العنوان</th>
                    <th>الاحتمالية</th>
                    <th>التأثير</th>
                    <th>المستوى</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody>
        `;

        rows.forEach(r => {

            const type =
                r.type === 'RISK' ? '⚠️ خطر' : '💡 فرصة';

            html += `
                <tr>
                    <td>${type}</td>
                    <td>${r.title || ''}</td>
                    <td>${r.probability || ''}</td>
                    <td>${r.impact || ''}</td>
                    <td class="risk">${r.risk_score ?? ''}</td>
                    <td>${r.status || ''}</td>
                    <td class="actions">
                        <button class="secondary"
                            onclick="editRisk(${r.risk_id})">
                            ✏️
                        </button>
                    </td>
                </tr>
            `;
        });

        html += `
            </tbody>
        </table>
        `;

        document.getElementById('content').innerHTML = html;

    } catch (error) {

        document.getElementById('content').innerHTML =
            '❌ حدث خطأ أثناء الاتصال بالخادم';

        console.error(error);
    }
}

async function saveRisk() {

    const token = getToken();
    const message = document.getElementById('formMessage');

    const title =
        document.getElementById('title').value.trim();

    if (!title) {
        message.innerHTML = '⚠️ يرجى إدخال العنوان';
        return;
    }

    const payload = {
        branch_id: 1,
        title: title,
        description:
            document.getElementById('description').value.trim(),
        type:
            document.getElementById('type').value,
        probability:
            Number(document.getElementById('probability').value),
        impact:
            Number(document.getElementById('impact').value),
        mitigation_action:
            document.getElementById('mitigation_action').value.trim(),
        responsible_employee_id:
            document.getElementById('responsible_employee_id').value
                ? Number(document.getElementById('responsible_employee_id').value)
                : null,
        due_date:
            document.getElementById('due_date').value || null,
        status:
            document.getElementById('status').value,

        post_probability:
            document.getElementById('post_probability').value
                ? Number(document.getElementById('post_probability').value)
                : null,

        post_impact:
            document.getElementById('post_impact').value
                ? Number(document.getElementById('post_impact').value)
                : null,

        effectiveness_result:
            document.getElementById('effectiveness_result').value.trim() || null,

        assessment_date:
            document.getElementById('assessment_date').value || null
    };

    try {

        const res = await fetch('/api/risks-opportunities', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
            message.innerHTML =
                '❌ ' + (data.message || 'تعذر حفظ البيانات');
            return;
        }

        message.innerHTML =
            '✅ تم حفظ السجل بنجاح';

        setTimeout(() => {
            hideForm();
            loadRisks();
        }, 700);

    } catch (error) {

        message.innerHTML =
            '❌ حدث خطأ أثناء الاتصال بالخادم';

        console.error(error);
    }
}

async function editRisk(id) {
    alert('شاشة التعديل سنضيفها في الخطوة التالية');
}

loadRisks();

</script>

</body>
</html>

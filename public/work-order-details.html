    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

<body onload="loadDetails()">
<div class="luxury-header">
    <div class="luxury-header-inner">
        <div class="luxury-title">
            <div class="luxury-mark">
    <img src="/muluk-logo.jpg"
         alt="ملوك التنجيد"
         class="details-logo">
</div>
            <div>
                <h1>تفاصيل أمر العمل</h1>
                <p>عرض بيانات أمر العمل والحسابات والدفعات</p>
            </div>
        </div>
        <button class="luxury-back" onclick="window.location.href='/work-orders.html'">
            ← أوامر العمل
        </button>
    </div>
</div>




<div class="container">

    <div class="topbar">
        <a class="back" href="/work-orders.html">← العودة إلى أوامر العمل</a>
        <button class="primary" onclick="loadDetails()">🔄 تحديث</button>
    </div>

    <div id="content">
        <div class="message">جاري تحميل البيانات...</div>
    </div>

</div>

<script>

const token = localStorage.getItem('token');

const params = new URLSearchParams(window.location.search);
const workOrderId = params.get('id');

const content = document.getElementById('content');

function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

async function api(url, options = {}) {

    const response = await fetch(url, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            ...(options.headers || {})
        }
    });

    if (response.status === 401) {
        localStorage.removeItem('token');
        window.location.href = '/index.html';
        return null;
    }

    const data = await response.json();

    if (!response.ok || !data.success) {
        throw new Error(data.message || 'تعذر تحميل البيانات');
    }

    return data;
}

async function loadDetails() {
    if (!token) {
        window.location.href = '/index.html';
        return;
    }

    if (!workOrderId) {
        content.innerHTML = `
            <div class="message">
                <strong>خطأ</strong>
                <p>لم يتم تحديد رقم أمر العمل.</p>
            </div>
        `;
        return;
    }

    content.innerHTML = `
        <div class="message">جاري تحميل تفاصيل أمر العمل...</div>
    `;

    try {
        const result = await api(
            '/api/work-orders/' + encodeURIComponent(workOrderId)
        );

        if (!result || !result.work_order) {
            throw new Error('لم يتم العثور على أمر العمل');
        }

        const order = result.work_order;

        window.currentWorkOrder = order;
        window.currentOrder = order;

        // تحميل مراحل أمر العمل
        let workOrderStages = [];

        try {
            const stagesResult = await api(
                '/api/work-orders/' +
                encodeURIComponent(workOrderId) +
                '/stages'
            );

            workOrderStages = stagesResult.stages || [];
        } catch (stageError) {
            console.warn(
                'تعذر تحميل مراحل أمر العمل:',
                stageError
            );
        }

        window.currentWorkOrderStages = workOrderStages;

        // زر الحذف يظهر فقط عندما يكون أمر التشغيل جديدًا ولم يتم اعتماده
        const editButton = document.getElementById('editWorkOrderButton');
        if (editButton) {
            editButton.style.display =
                order.status === 'NEW' ? 'inline-block' : 'none';
        }

        const deleteButton = document.getElementById('deleteWorkOrderButton');

        if (deleteButton) {
            deleteButton.style.display =
                order.status === 'NEW' ? 'inline-block' : 'none';
        }


        const statusText = {
            NEW: 'جديد',
            INSPECTION: 'قيد الفحص',
            WAITING_CUSTOMER_APPROVAL: 'بانتظار موافقة العميل',
            APPROVED: 'معتمد',
            IN_PROGRESS: 'قيد التنفيذ',
            QUALITY_CHECK: 'فحص الجودة',
            CORRECTION_REQUIRED: 'يحتاج تصحيح',
            READY_FOR_DELIVERY: 'جاهز للتسليم',
            DELIVERED: 'تم التسليم',
            CLOSED: 'مغلق',
            CANCELLED: 'ملغي'
        }[order.status] || order.status || 'غير محدد';

        const priorityText = {
            URGENT: 'عاجل',
            HIGH: 'مرتفع',
            NORMAL: 'عادي',
            LOW: 'منخفض'
        }[order.priority] || order.priority || 'غير محدد';

        let html = `
            <div class="card work-order-hero">
                <div style="text-align:center;">
                    <div style="font-size:14px;color:#777;margin-bottom:8px;">
                        📋 أمر العمل
                    </div>

                    <div style="font-size:28px;font-weight:800;letter-spacing:.5px;margin-bottom:16px;">
                        ${escapeHtml(order.work_order_no)}
                    </div>

                    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                        <span class="status">
                            ${escapeHtml(statusText)}
                        </span>

                        <span style="padding:8px 16px;border-radius:20px;background:#f1f1f1;font-weight:700;">
                            ${escapeHtml(priorityText)}
                        </span>
                    </div>

                    <div id="workOrderActions"
                        style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                        <button type="button"
                            onclick="resendWorkOrderWhatsApp()"
                            style="border:0;background:#25D366;color:#fff;padding:12px 20px;border-radius:10px;cursor:pointer;font-weight:800;font-size:15px;">
                            📲 إعادة إرسال أمر التشغيل
                        </button>

                        <button id="editWorkOrderButton"
                            type="button"
                            onclick="editCurrentWorkOrder()"
                            style="display:none;border:0;background:#2563eb;color:#fff;padding:12px 20px;border-radius:10px;cursor:pointer;font-weight:800;font-size:15px;">
                            ✏️ تعديل أمر التشغيل
                        </button>

                        <button id="deleteWorkOrderButton"
                            type="button"
                            onclick="deleteCurrentWorkOrder()"
                            style="display:none;border:0;background:#dc2626;color:#fff;padding:12px 20px;border-radius:10px;cursor:pointer;font-weight:800;font-size:15px;">
                            🗑️ حذف أمر التشغيل
                        </button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>👤 العميل</h2>

                <div class="grid">
                    <div class="item">
                        <div class="label">اسم العميل</div>
                        <div class="value">
                            ${escapeHtml(order.customer_name || '—')}
                        </div>
                    </div>

                    <div class="item">
                        <div class="label">رقم العميل</div>
                        <div class="value">
                            ${escapeHtml(order.customer_no || '—')}
                        </div>
                    </div>

                    <div class="item">
                        <div class="label">رقم الهاتف</div>
                        <div class="value">
                            ${escapeHtml(order.customer_phone || '—')}
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>🚗 السيارة</h2>

                <div class="grid">
                    <div class="item">
                        <div class="label">السيارة</div>
                        <div class="value">
                            ${escapeHtml(
                                [order.make, order.model]
                                    .filter(Boolean)
                                    .join(' ') || '—'
                            )}
                        </div>
                    </div>

                    <div class="item">
                        <div class="label">سنة الموديل</div>
                        <div class="value">
                            ${escapeHtml(order.model_year || '—')}
                        </div>
                    </div>

                    <div class="item">
                        <div class="label">رقم اللوحة</div>
                        <div class="value">
                            ${escapeHtml(order.plate_no || '—')}
                        </div>
                    </div>
                </div>
            </div>

            <div id="workOrderReadyPlaceholder"></div>

                    <div id="workOrderPaymentsPlaceholder"></div>
        `;

        content.innerHTML = html;

        renderReadyForDeliveryButton();

    } catch (error) {
        console.error('Load work order details error:', error);

        content.innerHTML = `
            <div class="message">
                <strong>تعذر تحميل أمر العمل</strong>
                <p>${escapeHtml(error.message || 'حدث خطأ غير متوقع')}</p>
            </div>
        `;
    }
}


function renderReadyForDeliveryButton() {
    const placeholder = document.getElementById(
        'workOrderReadyPlaceholder'
    );

    if (!placeholder) return;

    const stages = window.currentWorkOrderStages || [];

    const readyStage = stages.find(
        stage => stage.stage_name === 'جاهز للتسليم'
    );

    if (!readyStage) {
        placeholder.innerHTML = '';
        return;
    }

    if (readyStage.status === 'COMPLETED') {
        placeholder.innerHTML = `
            <div class="card" style="margin-top:18px;">
                <div style="text-align:center;">
                    <div style="font-size:38px;">🚗</div>

                    <h2 style="margin:8px 0;">
                        جاهز للتسليم
                    </h2>

                    <p style="color:#777;">
                        تم اعتماد العمل كجاهز للتسليم.
                    </p>
                </div>
            </div>
        `;
        return;
    }

    placeholder.innerHTML = `
        <div class="card" style="margin-top:18px;">
            <div style="text-align:center;">

                <div style="font-size:38px;">
                    🚗
                </div>

                <h2 style="margin:8px 0;">
                    اعتماد جاهزية العمل
                </h2>

                <p style="color:#777;margin:8px 0 18px;">
                    بعد التأكد من اكتمال العمل والفحص النهائي،
                    يمكنك اعتماد السيارة كجاهزة للتسليم.
                </p>

                <button
                    class="primary"
                    id="readyForDeliveryButton"
                    onclick="markWorkOrderReadyForDelivery(${readyStage.stage_id})">
                    ✅ العمل جاهز للتسليم
                </button>

            </div>
        </div>
    `;
}


async function markWorkOrderReadyForDelivery(stageId) {

    const confirmed = confirm(
        'هل تأكدت من اكتمال العمل والفحص النهائي؟\n\n' +
        'سيتم اعتماد أمر العمل كـ "جاهز للتسليم".'
    );

    if (!confirmed) return;

    const button = document.getElementById(
        'readyForDeliveryButton'
    );

    if (button) {
        button.disabled = true;
        button.textContent =
            '⏳ جاري اعتماد الجاهزية...';
    }

    try {

        const result = await api(
            '/api/work-orders/' +
            encodeURIComponent(workOrderId) +
            '/stages/' +
            encodeURIComponent(stageId),
            {
                method: 'PATCH',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    status: 'COMPLETED'
                })
            }
        );

        if (!result || !result.success) {
            throw new Error(
                result?.message ||
                'تعذر اعتماد جاهزية العمل'
            );
        }

        alert(
            '✅ تم اعتماد العمل كجاهز للتسليم بنجاح.'
        );

        await loadDetails();

    } catch (error) {

        console.error(
            'Mark ready for delivery error:',
            error
        );

        alert(
            'تعذر اعتماد جاهزية العمل:\n' +
            (error.message ||
            'حدث خطأ غير متوقع')
        );

        if (button) {
            button.disabled = false;
            button.textContent =
                '✅ العمل جاهز للتسليم';
        }
    }
}


async function createDesignApproval() {
    const message = document.getElementById('approvalMessage');

    const design_description =
        document.getElementById('approval_design_description').value.trim();

    const color_specification =
        document.getElementById('approval_color_specification').value.trim();

    const material_specification =
        document.getElementById('approval_material_specification').value.trim();

    const modification_description =
        document.getElementById('approval_modification_description').value.trim();

    if (!design_description || !color_specification || !material_specification) {
        message.textContent = 'يرجى إدخال وصف التصميم واللون والخامة قبل إنشاء الاعتماد.';
        message.style.color = '#b00020';
        return;
    }

    message.textContent = 'جاري إنشاء الاعتماد...';
    message.style.color = '';

    try {
        const result = await api(
            '/api/work-orders/' + encodeURIComponent(workOrderId) + '/design-approvals',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    design_description,
                    color_specification,
                    material_specification,
                    modification_description,
                    design_file_url: null
                })
            }
        );

        if (!result.success) {
            throw new Error(result.message || 'فشل إنشاء الاعتماد');
        }

let signatureCanvas = null;
let signatureCtx = null;
let drawing = false;
let signatureHasDrawing = false;

function initSignature() {
    signatureCanvas = document.getElementById('signatureCanvas');

    if (!signatureCanvas || signatureCanvas.dataset.ready === '1') return;

    signatureCtx = signatureCanvas.getContext('2d');
    signatureCtx.lineWidth = 3;
    signatureCtx.lineCap = 'round';
    signatureCtx.lineJoin = 'round';

    function point(event) {
        const rect = signatureCanvas.getBoundingClientRect();
        const source = event.touches ? event.touches[0] : event;

        return {
            x: (source.clientX - rect.left) *
               signatureCanvas.width / rect.width,
            y: (source.clientY - rect.top) *
               signatureCanvas.height / rect.height
        };
    }

    function start(event) {
        event.preventDefault();
        drawing = true;
        signatureHasDrawing = true;

        const p = point(event);
        signatureCtx.beginPath();
        signatureCtx.moveTo(p.x, p.y);
    }

    function move(event) {
        if (!drawing) return;

        event.preventDefault();

        const p = point(event);
        signatureCtx.lineTo(p.x, p.y);
        signatureCtx.stroke();
    }

    function end(event) {
        if (event) event.preventDefault();
        drawing = false;
    }

    signatureCanvas.addEventListener('mousedown', start);
    signatureCanvas.addEventListener('mousemove', move);
    signatureCanvas.addEventListener('mouseup', end);
    signatureCanvas.addEventListener('mouseleave', end);

    signatureCanvas.addEventListener('touchstart', start, {passive:false});
    signatureCanvas.addEventListener('touchmove', move, {passive:false});
    signatureCanvas.addEventListener('touchend', end, {passive:false});

    signatureCanvas.dataset.ready = '1';
}

function clearSignature() {
    if (!signatureCanvas || !signatureCtx) return;

    signatureCtx.clearRect(
        0,
        0,
        signatureCanvas.width,
        signatureCanvas.height
    );

    signatureHasDrawing = false;
}

async function uploadInspectionPhoto() {
    const fileInput = document.getElementById('inspection_photo_file');
    const typeInput = document.getElementById('inspection_photo_type');
    const captionInput = document.getElementById('inspection_photo_caption');
    const message = document.getElementById('photoMessage');

    if (!fileInput || !fileInput.files || !fileInput.files[0]) {
        alert('يرجى اختيار صورة أولًا.');
        return;
    }

    const file = fileInput.files[0];

    if (!file.type.startsWith('image/')) {
        alert('الملف المختار ليس صورة.');
        return;
    }

    const formData = new FormData();
    formData.append('photo', file);
    formData.append('photo_type', typeInput ? typeInput.value : 'OTHER');
    formData.append('caption', captionInput ? captionInput.value.trim() : '');

    try {
        if (message) message.textContent = 'جاري رفع الصورة...';

        const token = localStorage.getItem('token');

        const response = await fetch(
            '/api/work-orders/' + encodeURIComponent(workOrderId) + '/inspection/photos',
            {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                body: formData
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || 'فشل رفع الصورة');
        }

        if (message) message.textContent = '✅ تم رفع الصورة بنجاح.';

        fileInput.value = '';
        if (captionInput) captionInput.value = '';

        await loadInspectionPhotos();

    } catch (error) {
        console.error('Upload inspection photo error:', error);
        if (message) message.textContent = '❌ ' + escapeHtml(error.message);
    }
}

        const result = await api(
            '/api/work-orders/' + encodeURIComponent(workOrderId) + '/inspection',
            {

                body: JSON.stringify(body)
            }
        );

}

<script id="muluk-receipts-ui">
(function () {
    function getToken() {
        return localStorage.getItem('token') || localStorage.getItem('accessToken') || '';
    }

    function getWorkOrderId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id') || params.get('work_order_id');
    }

    function money(value) {
        return Number(value || 0).toLocaleString('ar-YE') + ' ريال';
    }

    window.openReceiptForm = function () {
        document.getElementById('receiptForm').style.display = 'block';
        document.getElementById('receiptAmount').focus();
    };

    window.closeReceiptForm = function () {
        document.getElementById('receiptForm').style.display = 'none';
    };

    window.loadReceipts = async function () {
        const workOrderId = getWorkOrderId();

        if (!workOrderId) {
            document.getElementById('receiptsList').innerHTML =
                '<div style="color:#b91c1c;padding:15px;">لم يتم العثور على رقم أمر التشغيل.</div>';
            return;
        }

        const currentOrder = window.currentWorkOrder;
        if (currentOrder) {
            document.getElementById('receiptTotal').textContent = money(currentOrder.total_amount);
            document.getElementById('receiptPaid').textContent = money(currentOrder.deposit_amount);
            document.getElementById('receiptBalance').textContent = money(currentOrder.balance_amount);
        }

        try {
            const response = await fetch('/api/receipts/work-order/' + encodeURIComponent(workOrderId), {
                headers: {
                    Authorization: 'Bearer ' + getToken()
                }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'فشل تحميل السندات');
            }

            const receipts = data.receipts || [];

            if (!receipts.length) {
                document.getElementById('receiptsList').innerHTML =
                    '<div style="text-align:center;color:#6b7280;padding:20px;">لا توجد سندات قبض حتى الآن.</div>';
                return;
            }

            let paid = 0;

            document.getElementById('receiptsList').innerHTML = receipts.map(function (r) {
                paid += Number(r.amount || 0);

                const date = r.received_at
                    ? new Date(r.received_at).toLocaleString('ar-YE')
                    : '—';

                const method = {
                    CASH: 'نقدي',
                    BANK_TRANSFER: 'تحويل بنكي',
                    E_WALLET: 'محفظة إلكترونية',
                    OTHER: 'أخرى'
                }[r.payment_method] || r.payment_method;

                return `
                    <div style="border:1px solid #e5e7eb;border-radius:12px;padding:15px;margin-top:10px;background:#fff;">
                        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">
                            <strong>🧾 ${r.receipt_no}</strong>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <strong>${money(r.amount)}</strong>
                                <button type="button"
                                    onclick="printReceipt(${r.receipt_id})"
                                    style="border:0;background:#111827;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;">
                                    🖨️ طباعة
                                </button>
                                
                                <button type="button"
                                    onclick="sendReceiptWhatsApp(${r.receipt_id})"
                                    style="border:0;background:#16a34a;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;">
                                    🟢 واتساب
                                </button>
                            </div>
                        </div>
                        <div style="color:#6b7280;font-size:13px;margin-top:7px;">
                            ${method} · ${date}
                        </div>
                        ${r.notes ? `<div style="margin-top:7px;">${r.notes}</div>` : ''}
                    </div>
                `;
            }).join('');

            const total = Number(window.currentWorkOrder?.total_amount || 0);
            document.getElementById('receiptTotal').textContent = money(total);
            document.getElementById('receiptPaid').textContent = money(paid);
            document.getElementById('receiptBalance').textContent = money(Math.max(total - paid, 0));

        } catch (error) {
            console.error('Receipts load error:', error);
            document.getElementById('receiptsList').innerHTML =
                '<div style="color:#b91c1c;padding:15px;">تعذر تحميل سندات القبض.</div>';
        }
    };

            phone = '967' + phone;
        }

                number = Math.floor(Number(number || 0));

                const ones = [

                    'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر',
                    'أربعة عشر', 'خمسة عشر', 'ستة عشر',

                ];

                    '', '', 'عشرون', 'ثلاثون', 'أربعون',
                    'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'
                ];

                function under100(n) {
                    if (n < 20) return ones[n];

                    const t = Math.floor(n / 10);
                    const o = n % 10;

                    if (!o) return tens[t];

                    return ones[o] + ' و' + tens[t];
                }

                function under1000(n) {
                    if (n < 100) return under100(n);

                    const h = Math.floor(n / 100);
                    const rest = n % 100;

                    const hundreds = [
                        '', 'مائة', 'مائتان', 'ثلاثمائة',
                        'أربعمائة', 'خمسمائة', 'ستمائة',
                        'سبعمائة', 'ثمانمائة', 'تسعمائة'
                    ];

                    if (!rest) return hundreds[h];

                    return hundreds[h] + ' و' + under100(rest);
                }

                if (number < 1000) {
                    return under1000(number) + ' ريال فقط';
                }

                if (number < 1000000) {
                    const thousands = Math.floor(number / 1000);
                    const rest = number % 1000;

                    let text;

                    if (thousands === 1) {
                        text = 'ألف';
                    } else if (thousands === 2) {
                        text = 'ألفان';
                    } else if (thousands < 11) {
                        text = under1000(thousands) + ' آلاف';
                    } else {
                        text = under1000(thousands) + ' ألف';
                    }

                    if (rest) {
                        text += ' و' + under1000(rest);
                    }

                    return text + ' ريال فقط';
                }

                return formatNumber(number) + ' ريال فقط';
            }

                alert('يرجى السماح بفتح النوافذ المنبثقة للطباعة');

    window.sendReceiptWhatsApp = async function (receiptId) {
        try {
            const token = getToken();

            if (!token) {
                alert('انتهت جلسة الدخول، يرجى تسجيل الدخول مرة أخرى');
                return;
            }

            const response = await fetch('/api/receipts/' + encodeURIComponent(receiptId), {
                headers: {
                    Authorization: 'Bearer ' + token
                }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'فشل جلب بيانات السند');
            }

            const r = data.receipt;

            if (!r.customer_phone) {
                alert('لا يوجد رقم هاتف مسجل للعميل');
                return;
            }

            let phone = String(r.customer_phone).replace(/[^\d+]/g, '');

            if (phone.startsWith('+967')) {
                phone = phone.substring(1);
            } else if (phone.startsWith('00967')) {
                phone = phone.substring(2);
            } else if (phone.startsWith('967')) {
                // الرقم بالفعل بالصيغة الدولية
            } else if (phone.startsWith('0')) {
                phone = '967' + phone.substring(1);
            } else {
                phone = '967' + phone;
            }

            const amount = Number(r.amount || 0).toLocaleString('ar-YE');
            const total = Number(r.total_amount || 0).toLocaleString('ar-YE');
            const balance = Number(r.balance_amount || 0).toLocaleString('ar-YE');

            const message =
`السلام عليكم ورحمة الله وبركاته

الأستاذ/ ${r.customer_name || ''}

تم استلام دفعة مالية مرتبطة بأمر التشغيل الخاص بسيارتكم لدى ملوك التنجيد لخدمات التنجيد.

🧾 رقم سند القبض: ${r.receipt_no}
🔧 رقم أمر التشغيل: ${r.work_order_no}
🚗 السيارة: ${r.make || ''} ${r.model || ''} ${r.model_year || ''}
💰 المبلغ المقبوض: ${amount} ريال
💵 إجمالي أمر التشغيل: ${total} ريال
📌 المتبقي: ${balance} ريال

نشكر لكم ثقتكم بملوك التنجيد.
نتمنى لكم تجربة مميزة معنا.

ملوك التنجيد لخدمات التنجيد`;

            const whatsappUrl =
                'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);

            window.open(whatsappUrl, '_blank');

        } catch (error) {
            console.error('WhatsApp receipt error:', error);
            alert(error.message || 'تعذر تجهيز رسالة واتساب');
        }
    };

    window.createReceipt = async function () {
        const workOrderId = getWorkOrderId();
        const amount = Number(document.getElementById('receiptAmount').value);
        const paymentMethod = document.getElementById('receiptPaymentMethod').value;
        const notes = document.getElementById('receiptNotes').value.trim();

        if (!workOrderId) {
            alert('رقم أمر التشغيل غير موجود');
            return;
        }

        if (!Number.isFinite(amount) || amount <= 0) {
            alert('أدخل مبلغًا صحيحًا');
            return;
        }

        try {
            const response = await fetch('/api/receipts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer ' + getToken()
                },
                body: JSON.stringify({
                    work_order_id: Number(workOrderId),
                    amount,
                    payment_method: paymentMethod,
                    notes: notes || null
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'فشل إنشاء سند القبض');
            }

            alert('تم إنشاء سند القبض: ' + data.receipt.receipt_no);

            document.getElementById('receiptAmount').value = '';
            document.getElementById('receiptNotes').value = '';
            closeReceiptForm();

            if (window.currentWorkOrder) {
                window.currentWorkOrder.deposit_amount = data.work_order.deposit_amount;
                window.currentWorkOrder.balance_amount = data.work_order.balance_amount;
            }

            await loadReceipts();

        } catch (error) {
            console.error('Create receipt error:', error);
            alert(error.message || 'تعذر إنشاء سند القبض');
        }
    };

    window.addEventListener('load', function () {
        setTimeout(loadReceipts, 500);
    });
})();
</script>
